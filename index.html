<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #050d1f;
  color: #fff;
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  overflow: hidden;
  height: 100vh;
  position: relative;
}
/* 背景光晕 */
body::before {
  content: '';
  position: fixed;
  top: -50%; left: -50%;
  width: 200%; height: 200%;
  background: radial-gradient(ellipse at 30% 20%, rgba(0, 150, 255, 0.15) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(0, 255, 150, 0.1) 0%, transparent 50%);
  animation: bgMove 20s ease-in-out infinite;
  pointer-events: none;
}
@keyframes bgMove {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(-2%, -2%); }
}
/* 网格背景 */
body::after {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image:
    linear-gradient(rgba(0, 200, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 200, 255, 0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}
/* 顶部标题 */
.header {
  height: 75px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: linear-gradient(180deg, rgba(0, 100, 200, 0.3) 0%, transparent 100%);
  border-bottom: 1px solid rgba(0, 200, 255, 0.2);
}
.header h1 {
  font-size: 34px;
  font-weight: bold;
  letter-spacing: 12px;
  background: linear-gradient(90deg, #00d4ff 0%, #00ff9d 50%, #00d4ff 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 30px rgba(0, 200, 255, 0.5);
  position: relative;
}
.header h1::before, .header h1::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 80px;
  height: 2px;
  background: linear-gradient(90deg, transparent, #00d4ff);
}
.header h1::before { right: 100%; margin-right: 20px; }
.header h1::after { left: 100%; margin-left: 20px; transform: scaleX(-1); }
.header .left-info {
  position: absolute;
  left: 30px;
  display: flex;
  gap: 20px;
  align-items: center;
}
.header .right-info {
  position: absolute;
  right: 30px;
  display: flex;
  gap: 20px;
  align-items: center;
}
.info-item {
  font-size: 14px;
  color: #88ccff;
}
.info-item span {
  color: #00ff9d;
  font-weight: bold;
  margin-left: 5px;
}
/* 主体布局 */
.main {
  display: grid;
  grid-template-columns: 1fr 1.6fr 1fr;
  gap: 12px;
  padding: 12px;
  height: calc(100vh - 75px);
}
.col {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
/* 卡片样式 */
.panel {
  background: linear-gradient(135deg, rgba(0, 80, 160, 0.15) 0%, rgba(0, 40, 80, 0.1) 100%);
  border: 1px solid rgba(0, 200, 255, 0.2);
  border-radius: 6px;
  padding: 12px 15px;
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  backdrop-filter: blur(10px);
}
.panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 20px; height: 20px;
  border-top: 2px solid #00d4ff;
  border-left: 2px solid #00d4ff;
}
.panel::after {
  content: '';
  position: absolute;
  bottom: 0; right: 0;
  width: 20px; height: 20px;
  border-bottom: 2px solid #00d4ff;
  border-right: 2px solid #00d4ff;
}
.panel-title {
  font-size: 15px;
  color: #00d4ff;
  margin-bottom: 8px;
  padding-left: 10px;
  border-left: 3px solid #00d4ff;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.panel-title .tag {
  font-size: 11px;
  color: #00ff9d;
  background: rgba(0, 255, 157, 0.1);
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid rgba(0, 255, 157, 0.3);
}
.chart {
  flex: 1;
  width: 100%;
  min-height: 0;
}
/* 中间指标卡 */
.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.metric {
  background: linear-gradient(135deg, rgba(0, 150, 255, 0.2) 0%, rgba(0, 80, 160, 0.1) 100%);
  border: 1px solid rgba(0, 200, 255, 0.3);
  border-radius: 6px;
  padding: 15px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.metric::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, #00d4ff, #00ff9d);
}
.metric-value {
  font-size: 32px;
  font-weight: bold;
  color: #00ff9d;
  text-shadow: 0 0 20px rgba(0, 255, 157, 0.6);
  font-family: 'DIN', 'Arial', sans-serif;
}
.metric-value .unit {
  font-size: 14px;
  margin-left: 3px;
  color: #88ccff;
}
.metric-label {
  font-size: 13px;
  color: #88ccff;
  margin-top: 5px;
}
.metric-trend {
  font-size: 11px;
  margin-top: 3px;
}
.trend-up { color: #00ff9d; }
.trend-down { color: #ff4d6d; }
/* 实时订单 */
.order-list {
  flex: 1;
  overflow: hidden;

}
.order-item {

  padding: 8px 10px;

@keyframes slideIn {

  to { opacity: 1; transform: translateX(0); }
}
.order-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 8px;
  animation: pulse 2s infinite;
}
@keyframes pulse {

.order-platform {

.p-sph { background: rgba(7, 193, 96, 0.2); color: #07c160; }

/* 底部状态栏 */

  border-radius: 50%;

}
</style>

// 时间更新
function updateTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  const y = now.getFullYear();
  const mo = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  const week = ['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];
  document.getElementById('timeStr').textContent = `${h}:${m}:${s}`;
  document.getElementById('dateStr').textContent = `${y}-${mo}-${d} ${week}`;
  document.getElementById('updateTime').textContent = `${h}:${m}:${s}`;
}
updateTime();
setInterval(updateTime, 1000);

// 数字滚动动画
function animateNumber(id, target, duration = 2000) {
  const el = document.getElementById(id);
  const start = 0;
  const startTime = Date.now();
  function update() {
    const elapsed = Date.now() - startTime;
    const progress = Math.min(elapsed / duration, 1);
    const ease = 1 - Math.pow(1 - progress, 3);
    const current = (start + (target - start) * ease).toFixed(1);
    el.innerHTML = current + '<span class="unit">' + el.querySelector('.unit').textContent + '</span>';
    if (progress < 1) requestAnimationFrame(update);
  }
  update();
}

// 实时订单滚动
const orders = [
  { platform: '抖音', product: '纯棉抗菌毛巾套装', amount: 79.8 },
  { platform: '小红书', product: '玻尿酸保湿精华液', amount: 89.0 },
  { platform: '视频号', product: '网红零食大礼包', amount: 149.7 },
  { platform: '抖音', product: '纯棉抗菌毛巾套装', amount: 39.9 },
  { platform: '抖音', product: '无线蓝牙耳机', amount: 129.0 },
  { platform: '小红书', product: '玻尿酸保湿精华液 x2', amount: 178.0 },
  { platform: '视频号', product: '网红零食大礼包', amount: 49.9 },
  { platform: '公众号', product: '精选好物组合装', amount: 199.0 },
  { platform: '抖音', product: '网红零食大礼包 x3', amount: 149.7 },
  { platform: '小红书', product: '纯棉抗菌毛巾套装', amount: 39.9 }
];
const orderList = document.getElementById('orderList');
let orderCount = 0;
function addOrder() {
  const order = orders[Math.floor(Math.random() * orders.length)];
  const pClass = order.platform === '抖音' ? 'p-douyin' : order.platform === '小红书' ? 'p-xhs' : order.platform === '视频号' ? 'p-sph' : 'p-gzh';
  const dotColor = order.platform === '抖音' ? '#ff0050' : order.platform === '小红书' ? '#ff2442' : order.platform === '视频号' ? '#07c160' : '#00d4ff';
  const item = document.createElement('div');
  item.className = 'order-item';
  item.innerHTML = `
    <span class="order-dot" style="background:${dotColor}"></span>
    <span class="order-platform ${pClass}">${order.platform}</span>
    <span class="order-product">${order.product}</span>
    <span class="order-amount">¥${order.amount.toFixed(2)}</span>
  `;
  orderList.insertBefore(item, orderList.firstChild);
  orderCount++;
  document.getElementById('orderCount').textContent = orderCount + '条';
  if (orderList.children.length > 6) {
    orderList.removeChild(orderList.lastChild);
  }
}
for (let i = 0; i < 5; i++) addOrder();
setInterval(addOrder, 2500);

// 从飞书加载实时数据
async function loadFeishuData() {
  try {
    const res = await fetch('/api/data?all=true');
    const result = await res.json();
    if (!result.success) {
      console.error('加载数据失败:', result.error);
      return;
    }
    const data = result.data;
    
    // 1. 更新核心指标
    const liveData = data['直播复盘'] || [];
    const orderData = data['订单管理'] || [];
    const accountData = data['账号管理'] || [];
    const adData = data['投流数据'] || [];
    
    const totalGMV = liveData.reduce((sum, r) => sum + (r['GMV'] || 0), 0);
    const totalOrders = orderData.length;
    const totalFans = accountData.reduce((sum, r) => sum + (r['粉丝数'] || 0), 0);
    const avgROI = adData.length > 0 ? adData.reduce((sum, r) => sum + (r['ROI'] || 0), 0) / adData.length : 0;
    
    // 更新指标卡（带动画）
    animateNumber('m1', (totalGMV / 10000).toFixed(2));
    animateNumber('m2', totalOrders);
    animateNumber('m3', (totalFans / 10000).toFixed(2));
    animateNumber('m4', avgROI.toFixed(1));
    
    // 2. 更新平台销售占比（从订单表统计）
    const platformMap = {};
    orderData.forEach(r => {
      const p = r['下单平台'] || '其他';
      platformMap[p] = (platformMap[p] || 0) + (r['实付金额'] || 0);
    });
    const platformColors = { '抖音': '#ff0050', '小红书': '#ff2442', '视频号': '#07c160', '公众号': '#00d4ff', '其他': '#888' };
    chartPlatform.setOption({
      series: [{
        data: Object.keys(platformMap).map(p => ({
          value: platformMap[p],
          name: p,
          itemStyle: { color: platformColors[p] || '#888' }
        }))
      }]
    });
    
    // 3. 更新商品销量TOP5（从商品库按库存排序）
    const productData = data['商品库'] || [];
    const topProducts = productData.sort((a, b) => (b['当前库存'] || 0) - (a['当前库存'] || 0)).slice(0, 5);
    chartTop5.setOption({
      yAxis: { data: topProducts.map(p => p['商品名称'] || '未知') },
      series: [{
        data: topProducts.map((p, i) => ({
          value: p['当前库存'] || 0,
          itemStyle: { color: i === 0 ? new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#ff0050'},{offset:1,color:'#ff8800'}]) : new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#00d4ff'},{offset:1,color:'#00ff9d'}]) }
        }))
      }]
    });
    
    // 4. 更新直播GMV趋势
    const liveSessions = liveData.map(r => r['直播场次'] || '未知');
    const liveGMVs = liveData.map(r => r['GMV'] || 0);
    const liveViewers = liveData.map(r => r['观看人数'] || 0);
    chartLive.setOption({
      xAxis: { data: liveSessions },
      series: [
        { name: 'GMV', data: liveGMVs },
        { name: '观看人数', data: liveViewers }
      ]
    });
    
    // 5. 更新投流ROI
    const adPlans = adData.map(r => r['投流计划名称'] || '未知');
    const adROIs = adData.map(r => r['ROI'] || 0);
    chartAd.setOption({
      yAxis: { data: adPlans },
      series: [{
        data: adROIs.map(v => ({ value: v, itemStyle: { color: v >= 3 ? '#00ff9d' : v >= 1 ? '#00d4ff' : '#ff8800' } }))
      }]
    });
    
    // 6. 更新收支结构（从财务表统计）
    const financeData = data['财务记录'] || [];
    const financeMap = {};
    financeData.forEach(r => {
      const c = r['分类'] || '其他';
      financeMap[c] = (financeMap[c] || 0) + (r['金额'] || 0);
    });
    const financeColors = { '商品销售': '#00ff9d', '佣金收入': '#00d4ff', '投流花费': '#ff4d6d', '商品成本': '#ff8800', '物流运费': '#9d4edd', '退款支出': '#ff0050', '人员工资': '#ffaa00', '办公费用': '#888', '其他': '#666' };
    chartFinance.setOption({
      series: [{
        data: Object.keys(financeMap).map(c => ({
          value: financeMap[c],
          name: c,
          itemStyle: { color: financeColors[c] || '#888' }
        }))
      }]
    });
    
    console.log('飞书数据加载成功:', new Date().toLocaleTimeString());
  } catch (e) {
    console.error('加载飞书数据失败:', e);
  }
}

// 页面加载后获取数据
setTimeout(loadFeishuData, 1000);
// 每30秒刷新一次
setInterval(loadFeishuData, 30000);

// 响应式
window.addEventListener('resize', () => {
  chartPlatform.resize();
  chartTop5.resize();
  chartFans.resize();
  chartLive.resize();
  chartAd.resize();
  chartFinance.resize();
  chartRadar.resize();
});
</script>
